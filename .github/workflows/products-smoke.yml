name: product-search-smoke
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/products/index.ts'
      - 'supabase/functions/notify/**'
      - 'app.js'
      - 'scripts/product-matching.test.mjs'
      - 'scripts/wishlist-tracking.test.mjs'
      - 'scripts/product-filters.mjs'
      - 'scripts/product-filters.test.mjs'
      - 'scripts/store-follow.test.mjs'
      - 'scripts/product-matching.live-smoke.mjs'
      - '.github/workflows/products-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test followed-store tracking and promotion alerts
        run: node --test scripts/store-follow.test.mjs
      - name: Test product category and price filters
        run: node --test scripts/product-filters.test.mjs
      - name: Test same-model matching across product types
        run: node --test scripts/product-matching.test.mjs
      - name: Test wishlist price tracking and target alerts
        run: node --test scripts/wishlist-tracking.test.mjs
      - name: Check live same-model matches across stores
        run: node scripts/product-matching.live-smoke.mjs
      - name: Check live Tupi and Bristol results
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://uxhftljmnljmtyynzyie.supabase.co/functions/v1/products?q=TV&debug=1';
          const response = await fetch(url, { signal: AbortSignal.timeout(120000) });
          if (!response.ok) throw new Error('products endpoint returned HTTP ' + response.status);
          const data = await response.json();
          for (const shop of ['Tupi', 'Bristol']) {
            const result = data[shop];
            console.log(shop + ':', JSON.stringify(result));
            if (!result || result.error || result.n < 1) throw new Error(shop + ' returned no products for TV');
          }
          NODE
