name: update
on:
  schedule: [{ cron: '17 */6 * * *' }]
  workflow_dispatch:
  push: { branches: [main], paths: ['scripts/**'] }
permissions: { contents: write }
concurrency: update
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/update.mjs
      # Guarda lo que sí se pudo actualizar aunque una fuente falle
      - if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data && git commit -m "datos" && git push || echo sin cambios
