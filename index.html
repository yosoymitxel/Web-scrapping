<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f7b5f'/%3E%3Cpath d='M9 22V10h7a4 4 0 0 1 0 8h-7' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
 <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
 <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
 <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></symbol>
 <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
</svg>

<header class="top">
 <div class="bar">
  <strong class="brand">Panel</strong>
  <button class="fx" id="fxBtn" aria-expanded="false" aria-controls="fxBox">
   <span class="mut">USD</span> <b id="rate">—</b>
  </button>
 </div>
 <div class="conv" id="fxBox" hidden>
  <label><span>USD</span><input id="usd" type="number" inputmode="decimal" min="0" step="any"></label>
  <svg class="ic"><use href="#i-swap"/></svg>
  <label><span>₲</span><input id="pyg" type="number" inputmode="numeric" min="0" step="any"></label>
 </div>
 <nav class="tabs" role="tablist">
  <a href="#asphalt" role="tab">Asphalt <span class="count" id="nAs"></span></a>
  <a href="#juegos" role="tab">Juegos</a>
  <a href="#tarjetas" role="tab">Tarjetas</a>
 </nav>
</header>

<main>
 <section id="asphalt" class="view">
  <div class="head"><h1>Códigos</h1><span class="mut" id="asAt"></span><button class="btn ghost" id="allDone" hidden>Marcar todos como canjeados</button></div>
  <ul class="codes" id="codes"></ul>
  <details class="done-box" id="doneBox" hidden>
   <summary>Canjeados <span id="nDone"></span></summary>
   <ul class="codes" id="done"></ul>
  </details>
 </section>

 <section id="juegos" class="view">
  <div class="seg" role="tablist" id="seg">
   <button data-s="gratis" aria-selected="true">Gratis</button>
   <button data-s="deseados" aria-selected="false">Deseados</button>
   <button data-s="bundles" aria-selected="false">Bundles</button>
  </div>

  <div data-p="gratis">
   <div class="head"><div class="chips" id="frChips"></div><span class="mut" id="frAt"></span></div>
   <div class="grid" id="free"></div>
  </div>

  <div data-p="deseados" hidden>
   <div class="head">
    <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="wlq" placeholder="Buscar" aria-label="Buscar en deseados"></label>
    <label class="toggle"><input type="checkbox" id="wlSale"> En oferta</label>
   </div>
   <ul class="rows" id="wl"></ul>
   <p class="mut foot" id="wlAt"></p>
  </div>

  <div data-p="bundles" hidden>
   <div class="head"><a class="mut" href="https://www.humblebundle.com/games" target="_blank" rel="noopener">Humble Bundle</a><span class="mut" id="hbAt"></span></div>
   <div class="grid" id="hb"></div>
  </div>
 </section>

 <section id="tarjetas" class="view">
  <form id="tq" class="search big" role="search">
   <svg class="ic"><use href="#i-search"/></svg>
   <input name="q" placeholder="Comercio" autocomplete="off" aria-label="Comercio">
  </form>
  <div class="chips" id="recent"></div>
  <ul class="rows" id="promos"></ul>
  <p class="foot mut"><a id="tjt" href="https://tarjetea.com.py/stores" target="_blank" rel="noopener">Ver en Tarjeteá</a></p>
 </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
