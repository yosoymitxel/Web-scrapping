<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0c0d10">
<title>Panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23c8f560'/%3E%3Cpath d='M10 23V9h7a5 5 0 0 1 0 10h-7' stroke='%230c0d10' stroke-width='3.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Onest:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></symbol>
 <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
 <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></symbol>
 <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
 <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 16H3v-3.5L5.5 8h11l3.5 4.5H21V16h-2"/><circle cx="7.5" cy="16.5" r="2"/><circle cx="16.5" cy="16.5" r="2"/><path d="M9.5 16.5h5"/></symbol>
 <symbol id="i-pad" viewBox="0 0 24 24"><path d="M7 7h10a5 5 0 0 1 4.9 6l-.6 3a2.5 2.5 0 0 1-4.2 1.2L15 15H9l-2.1 2.2a2.5 2.5 0 0 1-4.2-1.2l-.6-3A5 5 0 0 1 7 7Z"/><path d="M8 10v3M6.5 11.5h3"/><circle cx="16" cy="11" r=".5"/></symbol>
 <symbol id="i-card" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/></symbol>
 <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
</svg>

<header class="top">
 <div class="bar">
  <span class="brand">Panel</span>
  <nav class="tabs" aria-label="Secciones">
   <a href="#asphalt"><svg class="ic"><use href="#i-car"/></svg><span>Asphalt</span><b class="count" id="nAs"></b></a>
   <a href="#juegos"><svg class="ic"><use href="#i-pad"/></svg><span>Juegos</span></a>
   <a href="#tarjetas"><svg class="ic"><use href="#i-card"/></svg><span>Tarjetas</span></a>
  </nav>
  <button class="fx" id="fxBtn" aria-expanded="false" aria-controls="fxBox" aria-label="Dólar y conversor">
   <span>US$1</span><b id="rate">—</b>
  </button>
 </div>
 <div class="conv" id="fxBox" hidden>
  <label><span>US$</span><input id="usd" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
  <svg class="ic"><use href="#i-swap"/></svg>
  <label><span>₲</span><input id="pyg" type="number" inputmode="numeric" min="0" step="any" placeholder="0"></label>
 </div>
</header>

<main>
 <section id="asphalt" class="view">
  <div class="hero code-hero" id="asHero"></div>
  <div class="row-head"><h2>Pendientes</h2><button class="link" id="allDone" hidden>Marcar todos</button></div>
  <ul class="codes" id="codes"></ul>
  <details class="done-box" id="doneBox" hidden>
   <summary>Canjeados <span id="nDone"></span></summary>
   <ul class="codes" id="done"></ul>
  </details>
 </section>

 <section id="juegos" class="view">
  <a class="hero game-hero" id="frHero" target="_blank" rel="noopener"></a>
  <div class="row-head"><h2>Gratis</h2><div class="chips" id="frChips"></div></div>
  <div class="rail" id="free"></div>

  <div class="row-head">
   <h2>Deseados</h2>
   <div class="tools">
    <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="wlq" placeholder="Buscar" aria-label="Buscar en deseados"></label>
    <button class="chip" id="wlSale" aria-pressed="false">En oferta</button>
   </div>
  </div>
  <div class="wl" id="wl"></div>

  <div class="row-head"><h2>Bundles</h2><a class="link" href="https://www.humblebundle.com/games" target="_blank" rel="noopener">Humble</a></div>
  <div class="rail" id="hb"></div>
  <p class="stamp" id="gmAt"></p>
 </section>

 <section id="tarjetas" class="view">
  <div class="hero card-hero">
   <h1>¿Dónde comprás?</h1>
   <form id="tq" class="search big" role="search">
    <svg class="ic"><use href="#i-search"/></svg>
    <input name="q" placeholder="Comercio" autocomplete="off" aria-label="Comercio">
   </form>
   <div class="chips" id="recent"></div>
  </div>
  <div class="promos" id="promos"></div>
  <p class="stamp"><a id="tjt" class="link" href="https://tarjetea.com.py/stores" target="_blank" rel="noopener">Ver en Tarjeteá</a></p>
 </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
